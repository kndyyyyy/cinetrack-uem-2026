<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CineTrack</title>
</head>
<body>
    <header class="header-box">
        <h1>CineTrack</h1>
        <div class="barra-pesquisa">
            <input type="search" aria-label="Buscar filme">
            <button type="button"><span class="tela-menor">+</span><span class="tela-maior">+ Adicionar filme</span></button>
        </div>
    </header>

    <nav aria-label="Filtros de status" class="filtros header-box" id="filmes-filtros">
        <button class="ativo" data-status="todos">Todos</button>
        <button data-status="assistido">Assistido</button>
        <button data-status="assistindo">Assistindo</button>
        <button data-status="quero">Quero assistir</button>
        <button data-status="drop">Dropado</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
        </section>
    </main>

    <footer>

        <div id="modal" hidden>
            <div class="modal-conteudo">
                <h2>Adicionar filme</h2>
                <form id="form-filme">
                    <div class="campo">
                        <label for="titulo">Titulo</label>
                        <input type="text" id="titulo" name="titulo" value="" required>
                    </div>

                    <div class="campo">
                        <label for="ano">Ano</label>
                        <input type="number" id="ano" name="ano" value="" min="1888" max="2030" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <input type="text" id="genero" name="genero" value="" required>
                    </div>

                    <div class="campo">
                        <label for="poster">URL do poster</label>
                        <input type="text" id="poster" name="poster" value="">
                    </div>

                    <div class="campo">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="assistido">Assistido</option>
                            <option value="assistindo">Assistindo</option>
                            <option value="quero">Quero assistir</option>
                            <option value="drop">Drop</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nota">Nota (1 a 5)</label>
                        <select id="nota" name="nota">
                            <option value="5">5</option>
                            <option value="4">4</option>
                            <option value="3">3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentario</label>
                        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>
                    </div>

                    <div class="form-acoes">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <p>CineTrack - UEM</p>
        <a href="adicionar.html">+ Adicionar filme</a>
        <br>
        <a href="sobre.html">Sobre</a>
        <small></small>
    </footer>
    <script src="app.js"></script>
</body>
</html>
