<!DOCTYPE html>
<!--Paletas Cores-->
<!--Primária: #564787-->
<!--Acento: #dbcbd8-->
<!--Neutro: #f2fdff-->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CineTrack</title>
</head>
<body>
    <header>
        <h1>CineTrack</h1>
        <div class="barra-pesquisa">
            <input type="search" aria-label="Buscar filme">
            <button type="button"><span class="tela-menor">+</span><span class="tela-maior">+ Adicionar filme</span></button>
        </div>
        <nav aria-label="Filtros de status">
            <button class="ativo">Todos</button>
            <button>Assistido</button>
            <button>Assistindo</button>
            <button>Quero assistir</button>
            <button>Dropado</button>
        </nav>
    </header>

    <main>
        <section id="lista" aria-live="polite">
        </section>
    </main>

    <footer>

        <div id="modal" hidden>
            <div class="modal-conteudo">
                <h2>Adicionar filme</h2>
                <form id="form-filme">
                    <div class="campo">
                        <label for="titulo">Titulo</label>
                        <input type="text" value="" required>
                    </div>

                    <div class="campo">
                        <label for="ano">Ano</label>
                        <input type="number" value="" min="1888" max="2030" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <input type="text" value="" required>
                    </div>

                    <div class="campo">
                        <label for="url-poster">URL do poster</label>
                        <input type="text" value="">
                    </div>

                    <div class="campo">
                        <label for="status">Status</label>
                        <select required>
                            <option value="">Assistido</option>
                            <option value="">Assistindo</option>
                            <option value="">Quero assistir</option>
                            <option value="">Drop</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nota">Nota (1 a 5)</label>
                        <select>
                            <option value="">5</option>
                            <option value="">4</option>
                            <option value="">3</option>
                            <option value="">2</option>
                            <option value="">1</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentario</label>
                        <textarea rows="5" cols="40"></textarea>
                    </div>

                    <div class="form-acoes">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <p>CineTrack - UEM</p>
        <a href="adicionar.html">+ Adicionar filme</a>
        <br>
        <a href="sobre.html">Sobre</a>
        <small></small>
    </footer>
    <script src="app.js"></script>
</body>
</html>
