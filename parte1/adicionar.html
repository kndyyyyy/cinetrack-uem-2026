<!DOCTYPE html>
<!--Paletas Cores-->
<!--Primária: #561643-->
<!--Acento: #6c0e23-->
<!--Neutro: #f3ffb9-->
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adicionar filme - Cinetrack</title>
</head>
<body>
    <header>        
        <h1>CineTrack</h1>
        <nav>
            <a href="index.html">← Voltar</a>
        </nav>
    </header>
    <fieldset>
            <form id="form-filme">
                <h2>Adicionar filme</h2>

                <div class="campo">
                    <label for="titulo">Titulo</label>
                    <input type="text" value="" required>
                </div>

                <div class="campo">
                    <label for="ano">Ano</label>
                    <input type="number" value="" min="1888" max="2030" step="1" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input type="text" value="" required>
                </div>

                <div class="campo">
                    <label for="url-poster">URL do poster</label>
                    <input type="text" value="">
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select required>
                        <option value="">Assistido</option>
                        <option value="">Assistindo</option>
                        <option value="">Quero assistir</option>
                        <option value="">Drop</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota">Nota (1 a 5)</label>
                    <select>
                        <option value="">5</option>
                        <option value="">4</option>
                        <option value="">3</option>
                        <option value="">2</option>
                        <option value="">1</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="comentario">Comentario</label>
                    <textarea rows="5" cols="40"></textarea>
                </div>

                <div class="form-acoes">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>

            </form>

    </fieldset>

    <footer>
        <p>CineTrack - UEM</p>
        <a href="index.html">Página Inicial</a>
        <br>
        <a href="sobre.html">Sobre</a>
        <p>&copy; 2025 CineTrack</p>
    </footer>
</body>
</html>
