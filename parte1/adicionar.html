<!DOCTYPE html>
<!--Paletas Cores-->
<!--Primária: #561643-->
<!--Acento: #6c0e23-->
<!--Neutro: #f3ffb9-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adicionar filme - Cinetrack</title>
</head>
<body>
    <fieldset>
        <nav>
            <a href="index.html">← Voltar</a>
        </nav>
        <h1>Adicionar Filme</h1>
        
            <form id="form-filme">

                <label for="titulo">Titulo</label><br>
                <input type="text" value="" required><br><br>

                <label for="ano">Ano</label><br>
                <input type="number" value="" min="1888" max="2030" step="1" required><br><br>

                <label for="genero">Gênero</label><br>
                <input type="text" value="" required><br><br>

                <label for="url-poster">URL do poster</label><br>
                <input type="text" value=""><br><br>

                <label for="status">Status</label><br>
                <select required>
                    <option value="">Assistido</option>
                    <option value="">Assistindo</option>
                    <option value="">Quero assistir</option>
                    <option value="">Drop</option>
                </select><br><br>

                <label for="nota">Nota (1 a 5)</label><br>
                <select>
                    <option value="">5</option>
                    <option value="">4</option>
                    <option value="">3</option>
                    <option value="">2</option>
                    <option value="">1</option>
                </select><br><br>

                <label for="comentario">Comentario</label><br>
                <textarea rows="5" cols="40"></textarea><br><br>

                <button type="button">Cancelar</button>
                <button type="submit">Salvar</button>

            </form>

    </fieldset>

    <br>

    <footer>
        <p>CineTrack - UEM</p>
        <a href="index.html">Página Inicial</a>
        <br>
        <a href="sobre.html">Sobre</a>
    </footer>

    <p>&copy; 2025 CineTrack</p>
</body>
</html>
